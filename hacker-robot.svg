<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <style>
    @keyframes blink {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(20px); }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 2px #D97757); }
      50% { filter: drop-shadow(0 0 8px #D97757); }
    }
    .eye { animation: blink 4s infinite; }
    .body { animation: glow 3s ease-in-out infinite; }
  </style>

  <!-- Hood / Kapüşon -->
  <rect x="30" y="10" width="100" height="10" rx="2" fill="#1a1a2e"/>
  <rect x="20" y="20" width="120" height="10" fill="#1a1a2e"/>
  <rect x="15" y="30" width="130" height="10" fill="#1a1a2e"/>
  <rect x="10" y="40" width="140" height="15" fill="#1a1a2e"/>

  <!-- Head / Kafa (ekran) -->
  <rect class="body" x="25" y="55" width="110" height="60" rx="4" fill="#0d0d0d" stroke="#D97757" stroke-width="2"/>

  <!-- Screen glow background -->
  <rect x="30" y="60" width="100" height="50" rx="2" fill="#0a0a0a"/>

  <!-- Eyes / Gözler -->
  <g class="eye">
    <rect x="42" y="72" width="20" height="12" rx="1" fill="#D97757"/>
    <rect x="45" y="75" width="6" height="6" fill="#fff"/>
  </g>
  <g class="eye">
    <rect x="98" y="72" width="20" height="12" rx="1" fill="#D97757"/>
    <rect x="109" y="75" width="6" height="6" fill="#fff"/>
  </g>

  <!-- Mouth / Terminal text -->
  <rect x="50" y="94" width="6" height="3" fill="#3178C6"/>
  <rect x="58" y="94" width="12" height="3" fill="#3178C6"/>
  <rect x="72" y="94" width="8" height="3" fill="#3178C6"/>
  <rect x="82" y="94" width="16" height="3" fill="#D97757"/>
  <rect x="100" y="94" width="4" height="3" fill="#3178C6">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Body / Gövde -->
  <rect x="35" y="120" width="90" height="45" rx="3" fill="#1a1a2e" stroke="#D97757" stroke-width="1.5"/>

  <!-- Chest code lines -->
  <rect x="45" y="128" width="25" height="3" fill="#3178C6" opacity="0.7"/>
  <rect x="73" y="128" width="15" height="3" fill="#D97757" opacity="0.5"/>
  <rect x="45" y="134" width="10" height="3" fill="#D97757" opacity="0.6"/>
  <rect x="58" y="134" width="30" height="3" fill="#3178C6" opacity="0.4"/>
  <rect x="45" y="140" width="40" height="3" fill="#3178C6" opacity="0.5"/>
  <rect x="45" y="146" width="18" height="3" fill="#D97757" opacity="0.7"/>
  <rect x="66" y="146" width="22" height="3" fill="#3178C6" opacity="0.3"/>

  <!-- Arms / Kollar -->
  <rect x="5" y="125" width="28" height="12" rx="2" fill="#1a1a2e" stroke="#D97757" stroke-width="1"/>
  <rect x="127" y="125" width="28" height="12" rx="2" fill="#1a1a2e" stroke="#D97757" stroke-width="1"/>

  <!-- Hands -->
  <rect x="0" y="127" width="8" height="8" rx="2" fill="#D97757" opacity="0.8"/>
  <rect x="152" y="127" width="8" height="8" rx="2" fill="#D97757" opacity="0.8"/>

  <!-- Legs / Bacaklar -->
  <rect x="45" y="167" width="20" height="25" rx="2" fill="#1a1a2e" stroke="#D97757" stroke-width="1"/>
  <rect x="95" y="167" width="20" height="25" rx="2" fill="#1a1a2e" stroke="#D97757" stroke-width="1"/>

  <!-- Feet / Ayaklar -->
  <rect x="40" y="190" width="28" height="8" rx="2" fill="#0d0d0d" stroke="#D97757" stroke-width="1"/>
  <rect x="92" y="190" width="28" height="8" rx="2" fill="#0d0d0d" stroke="#D97757" stroke-width="1"/>

  <!-- Antenna -->
  <rect x="77" y="2" width="6" height="12" fill="#D97757"/>
  <circle cx="80" cy="2" r="4" fill="#D97757">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
